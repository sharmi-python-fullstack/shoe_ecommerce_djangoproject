{% extends "store/base.html" %}
{% block title %}Reset password | StepUp.in{% endblock %}
{% block content %}
<section class="account-card password-reset-card">
    <h1>Reset your password</h1>
    <p>Enter the email address linked to your account and we'll send password reset instructions.</p>
    <form method="post" class="account-form">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}
        <button type="submit">Send reset link</button>
    </form>
</section>
{% endblock %}
